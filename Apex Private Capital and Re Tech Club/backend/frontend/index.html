<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0D0D0D" />
    <meta name="description" content="Appex ADIPEC Concierge — премиальный цифровой консьерж для VIP-делегатов КазМунайГаз на конференции ADIPEC" />
    <title>Appex ADIPEC Concierge</title>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var el = document.body || document.documentElement;
        el.innerHTML = '<div style="color:red;background:white;padding:20px;z-index:9999;position:relative;min-height:100vh;"><h3>Fatal JS Error:</h3><p>' + message + '</p><p>Line: ' + lineno + '</p></div>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        var el = document.body || document.documentElement;
        el.innerHTML = '<div style="color:red;background:white;padding:20px;z-index:9999;position:relative;min-height:100vh;"><h3>Unhandled Promise:</h3><p>' + event.reason + '</p></div>';
      });
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
