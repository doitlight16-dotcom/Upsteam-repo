# Local development compose file.
#
# NOTE on the postgres user: this starts a single POSTGRES_USER for
# simplicity during scaffolding. The persistence/RLS build step replaces
# this with a proper role split -- a restricted `appex_app` role that the
# backend connects as (RLS-enforced, no BYPASSRLS) and a separate
# `appex_migrator` role used only for `alembic upgrade` (has BYPASSRLS).
# Never point the running backend at the migrator role.
#
# A production compose file (with Traefik + TLS, no host port publishing
# on postgres/redis) is added alongside this one in the deployment step.

services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appex

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appex_app
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: appex
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appex_app -d appex"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - appex

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - appex

  ai-module:
    build:
      context: ./ai-module
    networks:
      - appex

networks:
  appex:
    driver: bridge

volumes:
  postgres_data:
